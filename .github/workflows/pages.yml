# Builds the site with Hugo and publishes it to GitHub Pages on every push to main.
# One-time setting: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Hugo, after checking its checksum
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          file="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${file}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${file}" hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - name: Run the build checks
        run: tests/check.sh

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build for production
        env:
          HUGO_PROVIDER_NAME: ${{ secrets.PROVIDER_NAME }}
          HUGO_PROVIDER_STREET: ${{ secrets.PROVIDER_STREET }}
          HUGO_PROVIDER_POSTCODE: ${{ secrets.PROVIDER_POSTCODE }}
          HUGO_PROVIDER_CITY: ${{ secrets.PROVIDER_CITY }}
          HUGO_PROVIDER_EMAIL: ${{ secrets.PROVIDER_EMAIL }}
          HUGO_PROVIDER_PHONE: ${{ secrets.PROVIDER_PHONE }}
        run: hugo --environment production --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
